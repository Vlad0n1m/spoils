# Sample nginx site for the iDos Games edition stack (deploy/idos.compose.yml), next to spoils.conf:
#
#   idos.SPOILS_DOMAIN        -> edition web (Next.js) on 127.0.0.1:3100
#   game-idos.SPOILS_DOMAIN   -> edition game-server (Colyseus WebSocket) on 127.0.0.1:2667
#
# Replace SPOILS_DOMAIN, then get certificates, e.g.:
#   certbot --nginx -d idos.SPOILS_DOMAIN -d game-idos.SPOILS_DOMAIN
# Build the edition web image with NEXT_PUBLIC_GAME_SERVER_URL=wss://game-idos.SPOILS_DOMAIN (in .env.idos.local).
# The edition is shown in an iframe on idosgames.com: the web itself sends
# `Content-Security-Policy: frame-ancestors ...` (IDOS_FRAME_ANCESTORS). Do NOT add X-Frame-Options or
# another frame-ancestors header here, or the iDos frame stays blank. https is required: the session
# cookie of the edition is SameSite=None; Secure; Partitioned.
# deploy/nginx/catch-all.conf (once per host) keeps unknown Host names away from the web;
# SIWS_ALLOWED_HOSTS in .env.idos.local must list idos.SPOILS_DOMAIN.

map $http_upgrade $connection_upgrade_idos {
  default upgrade;
  ""      close;
}

# Security audit: per-IP caps in front of the single world process (seatless WebSockets and
# /matchmake floods). Players behind one carrier NAT share an address, so the WebSocket cap is
# generous; an honest player holds one socket.
limit_conn_zone $binary_remote_addr zone=ws_ip_idos:10m;
limit_req_zone  $binary_remote_addr zone=mm_ip_idos:10m rate=5r/s;

# Behind a CDN (docs/SCALING.md suggests Cloudflare before launch) $remote_addr is the CDN edge, so
# every player would share one login / register bucket of the web. Uncomment and list the CDN's
# current ranges (https://www.cloudflare.com/ips/) so $remote_addr (and X-Real-IP) is the visitor:
#   set_real_ip_from 173.245.48.0/20;   # ... every range of the list
#   real_ip_header CF-Connecting-IP;

server {
  listen 80;
  listen [::]:80;
  server_name idos.SPOILS_DOMAIN game-idos.SPOILS_DOMAIN;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name idos.SPOILS_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/idos.SPOILS_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/idos.SPOILS_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 2m;

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # No Upgrade / Connection here: the web serves no WebSockets, and an upgrade request is what
    # reached Next's absolute-URL proxy path (security audit, GHSA-c4j6-fc7j-m34r).
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name game-idos.SPOILS_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/idos.SPOILS_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/idos.SPOILS_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # A joinById body is a ticket and a map hash (< 1 KB); the game server caps it at 8 KB as well.
  client_max_body_size 16k;
  limit_conn ws_ip_idos 16;

  location /matchmake/ {
    limit_req zone=mm_ip_idos burst=20 nodelay;
    proxy_pass http://127.0.0.1:2667;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://127.0.0.1:2667;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_idos;
    # A map lasts up to 45 minutes; keep idle WebSockets open well past Colyseus' own pings.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
