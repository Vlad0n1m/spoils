# Catch-all for the nginx in front of spoils.conf and spoils-idos.conf: install it ONCE per host,
# next to them (e.g. /etc/nginx/conf.d/00-catch-all.conf), and remove the distribution's own default
# site (/etc/nginx/sites-enabled/default), which also claims default_server.
#
# Without it, a request whose Host matches no server_name goes to the first server on that port and
# reaches the web with that foreign Host. The web trusts the forwarded Host for the Sign-In with
# Solana domain (pinned by SIWS_ALLOWED_HOSTS as well) and for its same-origin checks, so unknown
# names must never get through. Needs nginx 1.19.4+ (ssl_reject_handshake: no certificate needed).

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
}
