# SPOILS on a single VPS: postgres + one-shot schema push + web (Next.js standalone) + game-server
# (Colyseus, one always-live world) + cron (calls the web cron routes with the Bearer CRON_SECRET).
#
#   cp .env.example .env    # fill it (README "Deploy"); compose also reads it for ${...} below
#   docker compose up -d --build
#
# web and game-server listen on 127.0.0.1 only (put deploy/nginx/spoils.conf in front for TLS);
# set WEB_BIND / GAME_BIND=0.0.0.0 to expose them directly.
# The project keeps its old name so the existing postgres volume (extract_postgres_data) stays attached.
name: extract

x-db-url: &db-url postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/extract

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: extract
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d extract"]
      interval: 3s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      CI: "true"
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        # NEXT_PUBLIC_* are baked into the client at build: rebuild the image after changing them.
        NEXT_PUBLIC_GAME_SERVER_URL: ${NEXT_PUBLIC_GAME_SERVER_URL:-ws://localhost:2567}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_SOLANA_CLUSTER: ${NEXT_PUBLIC_SOLANA_CLUSTER:-devnet}
        NEXT_PUBLIC_WALLET_DEV_TOPUP: ${NEXT_PUBLIC_WALLET_DEV_TOPUP:-0}
        NEXT_PUBLIC_GUEST_PLAY: ${NEXT_PUBLIC_GUEST_PLAY:-}
        NEXT_PUBLIC_MARKET_CURRENCY: ${NEXT_PUBLIC_MARKET_CURRENCY:-}
    # The image runs NODE_ENV=production: deploy/web-preflight.mjs refuses to start without
    # CRON_SECRET (16+ chars), DATABASE_URL, SESSION_SECRET or GAME_SERVER_HMAC_SECRET.
    env_file:
      - .env
    environment:
      DATABASE_URL: *db-url
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s

  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    # Production boot needs GAME_SERVER_ID, WEB_API_BASE_URL and GAME_SERVER_HMAC_SECRET (src/env.ts).
    env_file:
      - .env
    environment:
      DATABASE_URL: *db-url
      WEB_API_BASE_URL: http://web:3000
      GAME_SERVER_PORT: "2567"
      # Stable across restarts so the web can void the shards of a crashed process.
      # One game server per world: any fixed name works.
      GAME_SERVER_ID: ${GAME_SERVER_ID:-world-1}
    ports:
      - "${GAME_BIND:-127.0.0.1}:2567:2567"
    depends_on:
      web:
        condition: service_healthy
    # The world is always live: a crash must not leave it offline until someone restarts it by hand.
    # The new process opens a fresh shard of the current cycle and the web returns the old shard's gear.
    restart: unless-stopped

  # Replaces Vercel Cron (apps/web/vercel.json) on the VPS. Schedule: deploy/cron/schedule.json
  # (void-raids every 5 min, watch-deposits every 10 min, economy-daily at 00:05 UTC).
  # Only CRON_SECRET is passed in, not the whole .env.
  cron:
    image: node:20-bookworm-slim
    command: ["node", "/opt/spoils-cron/scheduler.mjs"]
    working_dir: /opt/spoils-cron
    user: node
    volumes:
      - ./deploy/cron:/opt/spoils-cron:ro
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      CRON_BASE_URL: http://web:3000
      # After a restart, sweep stale raids right away instead of waiting up to 5 minutes.
      CRON_RUN_ON_START: /api/cron/void-raids
      TZ: UTC
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
