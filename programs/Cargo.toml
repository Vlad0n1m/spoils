# Self-contained Anchor workspace (programs/Anchor.toml): nothing here touches the pnpm workspace.
[workspace]
members = ["spoils-events"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
