# Self-contained Anchor workspace (programs/Anchor.toml): nothing here touches the pnpm workspace.
[workspace]
members = ["spoils-events", "spoils-market"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# spoils_market is deployed from a devnet faucet budget: optimize it for size (program rent scales with bytes).
[profile.release.package.spoils-market]
opt-level = "z"
