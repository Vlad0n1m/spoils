[package]
name = "spoils-events"
version = "0.1.0"
description = "SPOILS game results on Solana: match settlements, boss kills and rare extracts, written by the game server only"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "spoils_events"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
